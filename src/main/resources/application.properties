spring.application.name=appointments-service

# Store the database in the application's working directory.
spring.datasource.url=jdbc:sqlite:appointments.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Use a single database connection for this initial implementation.
spring.datasource.hikari.maximum-pool-size=1

# Enforce foreign key constraints on each connection.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Run the schema script whenever the application starts.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql